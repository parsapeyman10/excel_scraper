[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-validator"
dynamic = ["version"]
description = "Industrial BOM integrity & SMT placement validator with desktop GUI and CI-ready CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "parsapeyman10" }]
keywords = ["bom", "smt", "pcb", "excel", "manufacturing", "quality", "pick-and-place"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business",
]
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
excel = ["pandas>=2.0", "xlsxwriter>=3.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
]
all = [
    "PyQt6>=6.5",
    "pandas>=2.0",
    "xlsxwriter>=3.1",
]

[project.scripts]
bomv = "bom_validator.cli:main"

[project.gui-scripts]
bom-validator = "bom_validator.gui.app:main"

[project.urls]
Homepage = "https://github.com/parsapeyman10/excel_scraper"
Issues = "https://github.com/parsapeyman10/excel_scraper/issues"

[tool.setuptools]
packages = [
    "bom_validator",
    "bom_validator.core",
    "bom_validator.io_excel",
    "bom_validator.reporting",
    "bom_validator.storage",
    "bom_validator.gui",
    "bom_validator.gui.widgets",
]

[tool.setuptools.dynamic]
version = { attr = "bom_validator.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bom_validator"]
omit = ["*/gui/app.py"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
